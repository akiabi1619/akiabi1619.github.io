    :root { color-scheme: dark; --bg: #191e24; --text: #e6e6df; --blue: #71d4ff; --violet: #d39aff; }
    * { box-sizing: border-box; }
    body { max-width: 760px; margin: 0 auto; padding: 32px 20px; background: var(--bg); color: var(--text); font: 18px/1.7 Consolas, "Courier New", monospace; }
    h1 { font-size: clamp(28px, 5vw, 40px); }
    a { color: var(--blue); text-underline-offset: .23em; }
    a:hover { color: var(--violet); }
    a:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
    li { margin: 12px 0; }
  </style>
</head>
